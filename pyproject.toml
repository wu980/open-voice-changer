[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-voice-changer"
version = "0.1.0"
description = "A local-first open source voice changer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "wu980" }
]
dependencies = [
  "click",
  "customtkinter",
  "librosa",
  "numpy",
  "soundfile"
]

[project.scripts]
open-voice-changer = "open_voice_changer.cli:main"
ovc = "open_voice_changer.cli:main"
ovc-ui = "open_voice_changer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
